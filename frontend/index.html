<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Assistant</title>
  </head>
  <body>
    <div class="container">
      <p id="question-paragraph">Select the file you want to use</p>
      <div id="drop_down">
        <select name="file-selection" id="file_selector">
          <option selected value="">select file</option>
        </select>
      </div>
      <label for="question">Enter your question here:</label>
      <input
        name="question_input"
        id="question"
        type="text"
        placeholder="Type here"
      />
      <button id="question_submit" type="button">Ask AI</button>
      <div id="answer_from_ai"></div>
      <div id="file_upload">
        <label for="subject">Enter the subject of the document</label>
        <input type="text" id="subject" placeholder="Enter subject here" />
        <label for="file-uploads">Upload your files from here</label>
        <input type="file" accept=".pdf,.txt" id="file-uploads" />
        <button type="button" id="upload-button">Upload file</button>
        <div id="file-upload-feedback"></div>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
